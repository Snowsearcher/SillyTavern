name: SnowBunny static check

on:
  push:
    branches:
      - snowbunny-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check SnowBunny JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/scripts/extensions/snowbunny-mobile -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --check public/scripts/extensions/regex/engine.js

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Lint SnowBunny Phone social files
        run: >-
          npx eslint --quiet --rule 'eol-last: off'
          public/scripts/extensions/snowbunny-mobile/phone-store.js
          public/scripts/extensions/snowbunny-mobile/phone-artwork.js
          public/scripts/extensions/snowbunny-mobile/phone-artwork-library.js
          public/scripts/extensions/snowbunny-mobile/phone-artwork-manager-ui.js
          public/scripts/extensions/snowbunny-mobile/phone-history-status.js
          public/scripts/extensions/snowbunny-mobile/phone-history-status-ui.js
          public/scripts/extensions/snowbunny-mobile/phone-social-network.js
          public/scripts/extensions/snowbunny-mobile/phone-social-actions.js
          public/scripts/extensions/snowbunny-mobile/phone-social-world.js
          public/scripts/extensions/snowbunny-mobile/phone-social-ui.js
          public/scripts/extensions/snowbunny-mobile/phone-social-profile-ui.js
          public/scripts/extensions/snowbunny-mobile/phone-social-artwork-ui.js
          public/scripts/extensions/snowbunny-mobile/phone-social-paging-ui.js
          public/scripts/extensions/snowbunny-mobile/phone-social-lifecycle.js
          public/scripts/extensions/snowbunny-mobile/bootstrap.js

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Run focused Phone social tests
        working-directory: tests
        run: npm run test:unit -- snowbunny-phone-social.test.js --runInBand
