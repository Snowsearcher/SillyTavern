name: SnowBunny static check

on:
  push:
    branches:
      - snowbunny-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check SnowBunny JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/scripts/extensions/snowbunny-mobile -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --check public/scripts/extensions/regex/engine.js
